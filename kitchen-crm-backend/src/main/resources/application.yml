server:
  port: 8080

spring:
  application:
    name: kitchen-crm-backend

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    validate-on-migrate: false

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/kitchen_crm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:kitchen_crm}
    password: ${DB_PASSWORD:password123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

app:
  upload-dir: uploads/plan-images
  design-upload-dir: uploads/design-files
  max-file-size: 52428800  # 50MB in bytes
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  pdf:
    include-plan-images: true
    max-image-width: 400
    max-image-height: 300
  notifications:
    attach-quotation-pdf: true
  jwt:
    secret: ${JWT_SECRET:aW52YWxpZGF0ZWRKV1RTZWNyZXRLZXlGb3JLaXRjaGVuQ1JNQXBwbGljYXRpb25TZWN1cml0eQ==}
    expiration: 86400000 # 24 hours
  margin:
    default-percentage: ${DEFAULT_MARGIN:15.0}

  # Email Configuration - Gmail SMTP Only
  email:
    enabled: ${EMAIL_ENABLED:true}
    retry-attempts: 3
    retry-delay-ms: 2000

    # Gmail SMTP Configuration (Free up to 500 emails/day)
    smtp:
      host: smtp.gmail.com
      port: 587
      username: thaquidheen@gmail.com
      password: xfhemzassuywbyvu
      from-email: thaquidheen@gmail.com
      from-name: HOCH
      auth: true
      starttls: true

  # Signature Configuration
  signature:
    base-url: ${SIGNATURE_BASE_URL:http://localhost:3000}
    token-expiry-days: 7
    reminder-days: [3, 6]
    enable-reminders: true

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.kitchencrm: DEBUG
    org.springframework.security: DEBUG
    org.springframework.mail: DEBUG
    org.springframework.mail.javamail: DEBUG
    jakarta.mail: DEBUG
    com.sun.mail: DEBUG