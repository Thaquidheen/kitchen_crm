server:
  port: 8080

spring:
  application:
    name: kitchen-crm-backend

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    validate-on-migrate: false
    out-of-order: true

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/kitchen_crm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

app:
  upload-dir: uploads/plan-images
  design-upload-dir: uploads/design-files
  max-file-size: 52428800  # 50MB in bytes
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  pdf:
    include-plan-images: true
    max-image-width: 400
    max-image-height: 300
  notifications:
    attach-quotation-pdf: true
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}     # 15 minutes
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
    expiration: ${JWT_EXPIRATION:900000} # Legacy fallback
  auth:
    default-role: ${DEFAULT_ROLE:ROLE_STAFF} # Options: ROLE_STAFF, ROLE_SUPER_ADMIN
  margin:
    default-percentage: ${DEFAULT_MARGIN:15.0}

  # Email Configuration - Gmail SMTP Only
  email:
    enabled: ${EMAIL_ENABLED:true}
    retry-attempts: 3
    retry-delay-ms: 2000

    # Gmail SMTP Configuration (Free up to 500 emails/day)
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      from-email: ${SMTP_FROM_EMAIL}
      from-name: ${SMTP_FROM_NAME:HOCH}
      auth: true
      starttls: true

  # Signature Configuration
  signature:
    base-url: ${SIGNATURE_BASE_URL:http://localhost:3000}
    token-expiry-days: 7
    reminder-days: [3, 6]
    enable-reminders: true

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.kitchencrm: DEBUG
    org.springframework.security: DEBUG
    org.springframework.mail: DEBUG
    org.springframework.mail.javamail: DEBUG
    jakarta.mail: DEBUG
    com.sun.mail: DEBUG