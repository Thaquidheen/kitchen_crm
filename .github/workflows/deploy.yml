name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 157.173.114.116
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/kitchen-crm
            git pull origin main
            docker compose -p kitchen-crm-backend -f docker-compose.prod.yml up -d --no-deps --build backend
            docker compose -p kitchen-crm-backend -f docker-compose.prod.yml up -d --no-deps --build frontend
            echo "Deployment complete!"
