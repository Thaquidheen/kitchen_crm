services:
  mysql:
    image: mysql:8.0
    container_name: kitchen_crm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kitchen_crm
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kitchen-crm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./kitchen-crm-backend
    container_name: kitchen_crm_backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # The app's business clock. Without this the JVM defaults to UTC and every LocalDateTime.now()
      # — customer timestamps, reminders, quotations, the nightly cron jobs — runs 5h30m behind the
      # office. V108 shifts the history to match; from here new rows are IST at the source.
      - TZ=Asia/Kolkata
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SIGNATURE_BASE_URL=${FRONTEND_URL}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kitchen-crm-network

  frontend:
    build:
      context: ./kitchen-crm-frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: kitchen_crm_frontend
    restart: always
    networks:
      - kitchen-crm-network

  nginx:
    image: nginx:alpine
    container_name: kitchen_crm_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - kitchen-crm-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  kitchen-crm-network:
    driver: bridge
